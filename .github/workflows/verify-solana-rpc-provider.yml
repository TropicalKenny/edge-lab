name: Verify Solana RPC Provider

on:
  push:
    branches:
      - feat/solana-provider-neutral-alchemy

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e . pytest
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test provider adapter
        run: pytest -q tests/test_solana_rpc.py tests/test_solana.py
      - name: Full test suite
        run: pytest -q
