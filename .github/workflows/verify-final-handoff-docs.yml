name: Verify Final Live Handoff Docs

on:
  push:
    branches:
      - docs/final-live-handoff-2026-09-03
    paths:
      - .github/workflows/verify-final-handoff-docs.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e . pytest
      - name: Full repository verification
        run: sh scripts/verify-repo.sh
