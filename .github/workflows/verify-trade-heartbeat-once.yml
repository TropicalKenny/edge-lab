name: Verify Trade Heartbeat Alerts Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-trade-heartbeat-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/telegram-trade-heartbeat-alerts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e . pytest
      - name: Full repository verification
        run: sh scripts/verify-repo.sh
