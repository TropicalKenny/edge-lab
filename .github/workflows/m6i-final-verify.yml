name: Verify M6I Owner Controls

on:
  push:
    branches:
      - feat/m6i-owner-controls-telegram

permissions:
  contents: read

concurrency:
  group: edge-lab-m6i-final-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Edge Lab with test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run repository verification
        run: sh scripts/verify-repo.sh
