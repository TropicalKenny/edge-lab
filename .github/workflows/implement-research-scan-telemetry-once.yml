name: Implement Research Scan Telemetry Once

on:
  push:
    branches:
      - feat/research-scan-telemetry
    paths:
      - .github/workflows/implement-research-scan-telemetry-once.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edge
          POSTGRES_PASSWORD: edge_test_password
          POSTGRES_DB: edge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edge -d edge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/research-scan-telemetry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply isolated telemetry implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              write(path, text.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              text = read(path)
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f"{path}: start marker not found: {start!r}")
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f"{path}: end marker not found: {end!r}")
              write(path, text[:i] + replacement + text[j:])

          # Dedicated telemetry model. It is deliberately separate from execution/trade evidence.
          forward_models = read("app/forward_models.py")
          if "class ForwardScanObservation" not in forward_models:
              forward_models += '''\n\nclass ForwardScanObservation(Base):\n    __tablename__ = "forward_scan_observations"\n    __table_args__ = (\n        UniqueConstraint("study_id", "external_key", name="forward_scan_study_key_unique"),\n    )\n\n    id: Mapped[str] = mapped_column(String(36), primary_key=True, default=uid)\n    study_id: Mapped[str] = mapped_column(ForeignKey("forward_studies.id"), index=True)\n    external_key: Mapped[str] = mapped_column(String(180))\n    observation_kind: Mapped[str] = mapped_column(String(24), index=True)\n    observed_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), index=True)\n    examined_count: Mapped[int] = mapped_column(Integer, default=0)\n    accepted_count: Mapped[int] = mapped_column(Integer, default=0)\n    rejected_count: Mapped[int] = mapped_column(Integer, default=0)\n    deferred_count: Mapped[int] = mapped_column(Integer, default=0)\n    rejection_reasons_json: Mapped[str] = mapped_column(Text, default="{}")\n    metadata_json: Mapped[str] = mapped_column(Text, default="{}")\n    created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), default=utcnow)\n'''
              write("app/forward_models.py", forward_models)

          Path("app/scan_telemetry.py").write_text('''from __future__ import annotations\n\nimport json\nimport re\nfrom collections import Counter\nfrom datetime import datetime, timedelta, timezone\nfrom typing import Any, Mapping\n\nfrom sqlalchemy import select\nfrom sqlalchemy.orm import Session\n\nfrom app.forward_models import ForwardScanObservation\n\n_NUMERIC_METADATA_KEYS = {\n    "launches_in_window",\n    "features_ready",\n    "quote_attempts",\n    "opened",\n    "markets_discovered",\n    "markets_validated",\n    "structural_candidates",\n    "attempts",\n    "trades",\n}\n\n\ndef _aware(value: datetime) -> datetime:\n    return value if value.tzinfo is not None else value.replace(tzinfo=timezone.utc)\n\n\ndef _json(value: Mapping[str, Any] | None) -> str:\n    return json.dumps(dict(value or {}), default=str, sort_keys=True, separators=(",", ":"))\n\n\ndef normalize_reason(value: str) -> str:\n    text = re.sub(r"[^A-Za-z0-9]+", "_", str(value).strip()).strip("_").upper()\n    return text[:120] or "UNSPECIFIED_REJECTION"\n\n\ndef record_scan_observation(\n    db: Session,\n    *,\n    study_id: str,\n    external_key: str,\n    observation_kind: str,\n    observed_at: datetime,\n    examined_count: int = 0,\n    accepted_count: int = 0,\n    rejected_count: int = 0,\n    deferred_count: int = 0,\n    rejection_reasons: Mapping[str, int] | None = None,\n    metadata: Mapping[str, Any] | None = None,\n) -> ForwardScanObservation:\n    counts = (examined_count, accepted_count, rejected_count, deferred_count)\n    if any(int(value) < 0 for value in counts):\n        raise ValueError("scan telemetry counts cannot be negative")\n    if accepted_count + rejected_count > examined_count:\n        raise ValueError("accepted + rejected cannot exceed examined")\n    if observation_kind not in {"cycle", "candidate"}:\n        raise ValueError("observation_kind must be cycle or candidate")\n    reasons = {normalize_reason(k): int(v) for k, v in (rejection_reasons or {}).items() if int(v) > 0}\n    reasons_json = _json(reasons)\n    metadata_json = _json(metadata)\n    existing = db.scalar(\n        select(ForwardScanObservation).where(\n            ForwardScanObservation.study_id == study_id,\n            ForwardScanObservation.external_key == external_key,\n        )\n    )\n    if existing is not None:\n        # Candidate keys are deliberately stable. Re-observing the same frozen decision\n        # returns the original row rather than double-counting it.\n        if (\n            existing.observation_kind != observation_kind\n            or existing.examined_count != examined_count\n            or existing.accepted_count != accepted_count\n            or existing.rejected_count != rejected_count\n            or existing.deferred_count != deferred_count\n            or existing.rejection_reasons_json != reasons_json\n            or existing.metadata_json != metadata_json\n        ):\n            raise ValueError(f"conflicting scan observation for {study_id}/{external_key}")\n        return existing\n    row = ForwardScanObservation(\n        study_id=study_id,\n        external_key=external_key,\n        observation_kind=observation_kind,\n        observed_at=_aware(observed_at),\n        examined_count=int(examined_count),\n        accepted_count=int(accepted_count),\n        rejected_count=int(rejected_count),\n        deferred_count=int(deferred_count),\n        rejection_reasons_json=reasons_json,\n        metadata_json=metadata_json,\n    )\n    db.add(row)\n    db.commit()\n    db.refresh(row)\n    return row\n\n\ndef scan_activity_summary(\n    db: Session,\n    *,\n    study_id: str,\n    now: datetime,\n    window_hours: int = 24,\n) -> dict[str, Any]:\n    now = _aware(now)\n    since = now - timedelta(hours=window_hours)\n    rows = db.scalars(\n        select(ForwardScanObservation)\n        .where(\n            ForwardScanObservation.study_id == study_id,\n            ForwardScanObservation.observed_at >= since,\n            ForwardScanObservation.observed_at <= now,\n        )\n        .order_by(ForwardScanObservation.observed_at.asc())\n    ).all()\n    earliest = db.scalar(\n        select(ForwardScanObservation)\n        .where(ForwardScanObservation.study_id == study_id)\n        .order_by(ForwardScanObservation.observed_at.asc())\n        .limit(1)\n    )\n    reasons: Counter[str] = Counter()\n    metadata_totals: Counter[str] = Counter()\n    examined = accepted = rejected = deferred = cycles = 0\n    last_scan_at = None\n    for row in rows:\n        examined += int(row.examined_count)\n        accepted += int(row.accepted_count)\n        rejected += int(row.rejected_count)\n        deferred += int(row.deferred_count)\n        if row.observation_kind == "cycle":\n            cycles += 1\n        last_scan_at = _aware(row.observed_at)\n        try:\n            reason_map = json.loads(row.rejection_reasons_json)\n        except json.JSONDecodeError:\n            reason_map = {}\n        if isinstance(reason_map, dict):\n            for reason, count in reason_map.items():\n                try:\n                    reasons[normalize_reason(reason)] += max(0, int(count))\n                except (TypeError, ValueError):\n                    continue\n        try:\n            meta = json.loads(row.metadata_json)\n        except json.JSONDecodeError:\n            meta = {}\n        if isinstance(meta, dict):\n            for key in _NUMERIC_METADATA_KEYS:\n                value = meta.get(key)\n                if isinstance(value, (int, float)) and not isinstance(value, bool):\n                    metadata_totals[key] += int(value)\n    return {\n        "tracking": earliest is not None,\n        "tracking_since": _aware(earliest.observed_at) if earliest is not None else None,\n        "window_hours": window_hours,\n        "last_scan_at": last_scan_at,\n        "cycles": cycles,\n        "examined": examined,\n        "accepted": accepted,\n        "rejected": rejected,\n        "deferred": deferred,\n        "top_rejection_reasons": [\n            {"reason": reason, "count": count} for reason, count in reasons.most_common(5)\n        ],\n        "metadata_totals": dict(sorted(metadata_totals.items())),\n    }\n''')

          # Migration from the actual current Alembic head.
          Path("alembic/versions/n4f7bc08e399_add_forward_scan_observations.py").write_text('''"""add forward scan observations\n\nRevision ID: n4f7bc08e399\nRevises: m3e6ab97d288\nCreate Date: 2026-09-03 12:55:00\n"""\n\nfrom collections.abc import Sequence\n\nimport sqlalchemy as sa\nfrom alembic import op\n\nrevision: str = "n4f7bc08e399"\ndown_revision: str | Sequence[str] | None = "m3e6ab97d288"\nbranch_labels = None\ndepends_on = None\n\n\ndef upgrade() -> None:\n    op.create_table(\n        "forward_scan_observations",\n        sa.Column("id", sa.String(length=36), nullable=False),\n        sa.Column("study_id", sa.String(length=36), nullable=False),\n        sa.Column("external_key", sa.String(length=180), nullable=False),\n        sa.Column("observation_kind", sa.String(length=24), nullable=False),\n        sa.Column("observed_at", sa.DateTime(timezone=True), nullable=False),\n        sa.Column("examined_count", sa.Integer(), nullable=False, server_default="0"),\n        sa.Column("accepted_count", sa.Integer(), nullable=False, server_default="0"),\n        sa.Column("rejected_count", sa.Integer(), nullable=False, server_default="0"),\n        sa.Column("deferred_count", sa.Integer(), nullable=False, server_default="0"),\n        sa.Column("rejection_reasons_json", sa.Text(), nullable=False, server_default="{}"),\n        sa.Column("metadata_json", sa.Text(), nullable=False, server_default="{}"),\n        sa.Column("created_at", sa.DateTime(timezone=True), nullable=False, server_default=sa.func.now()),\n        sa.ForeignKeyConstraint(["study_id"], ["forward_studies.id"]),\n        sa.PrimaryKeyConstraint("id"),\n        sa.UniqueConstraint("study_id", "external_key", name="forward_scan_study_key_unique"),\n    )\n    op.create_index("ix_forward_scan_observations_study_id", "forward_scan_observations", ["study_id"], unique=False)\n    op.create_index("ix_forward_scan_observations_observation_kind", "forward_scan_observations", ["observation_kind"], unique=False)\n    op.create_index("ix_forward_scan_observations_observed_at", "forward_scan_observations", ["observed_at"], unique=False)\n\n\ndef downgrade() -> None:\n    op.drop_index("ix_forward_scan_observations_observed_at", table_name="forward_scan_observations")\n    op.drop_index("ix_forward_scan_observations_observation_kind", table_name="forward_scan_observations")\n    op.drop_index("ix_forward_scan_observations_study_id", table_name="forward_scan_observations")\n    op.drop_table("forward_scan_observations")\n''')

          # Solana: persist each unique decision-time launch evaluation, plus a per-cycle heartbeat.
          replace_once(
              "app/solana_forward.py",
              "from app.services import HealthRegistry\n",
              "from app.services import HealthRegistry\nfrom app.scan_telemetry import record_scan_observation\n",
          )
          solana_method = '''    async def _attempt_new_entries(\n        self,\n        db: Session,\n        study: ForwardStudy,\n        config: SolanaForwardConfig,\n        *,\n        now: datetime,\n    ) -> tuple[int, int]:\n        attempted = self._attempted_signatures(db, study.id)\n        open_positions = self._open_positions(db, study.id)\n        capacity = max(0, config.max_open_positions - len(open_positions))\n        cycle_key = f"solana-cycle:{int(_aware(now).timestamp() // 60)}"\n        if capacity <= 0:\n            record_scan_observation(\n                db, study_id=study.id, external_key=cycle_key, observation_kind="cycle",\n                observed_at=now, deferred_count=1, metadata={"open_positions": len(open_positions)},\n            )\n            return 0, 0\n        equity = self._equity(db, study)\n        allocated_open = sum(\n            (position.allocated_capital_usd for position in open_positions), ZERO\n        )\n        if allocated_open + config.entry_notional_usd > equity:\n            record_scan_observation(\n                db, study_id=study.id, external_key=cycle_key, observation_kind="cycle",\n                observed_at=now, deferred_count=1, metadata={"capital_capacity_blocked": 1},\n            )\n            return 0, 0\n\n        cutoff = _aware(now) - timedelta(minutes=config.max_candidate_age_minutes)\n        launches = db.scalars(\n            select(SolanaLaunchEvent)\n            .where(\n                SolanaLaunchEvent.observed_at >= study.started_at,\n                SolanaLaunchEvent.observed_at >= cutoff,\n            )\n            .order_by(SolanaLaunchEvent.observed_at.asc())\n            .limit(1000)\n        ).all()\n        opened = 0\n        quote_attempts = 0\n        features_ready = 0\n        for launch in launches:\n            if launch.signature in attempted:\n                continue\n            if opened >= min(capacity, config.max_entries_per_cycle):\n                break\n            feature = await self._ensure_feature(db, launch, config, now=now)\n            if feature is None:\n                continue\n            features_ready += 1\n            candidate_key = f"solana-candidate:{launch.signature}"\n            security = self._security_for_feature(db, feature)\n            eligible, eligibility_reasons = self._eligibility(feature, security, config)\n            if not eligible:\n                record_scan_observation(\n                    db,\n                    study_id=study.id,\n                    external_key=candidate_key,\n                    observation_kind="candidate",\n                    observed_at=_aware(feature.captured_at),\n                    examined_count=1,\n                    rejected_count=1,\n                    rejection_reasons={reason: 1 for reason in eligibility_reasons},\n                    metadata={"mint": launch.mint, "stage": "safety_exitability"},\n                )\n                continue\n            if allocated_open + (opened + 1) * config.entry_notional_usd > equity:\n                record_scan_observation(\n                    db, study_id=study.id, external_key=candidate_key, observation_kind="candidate",\n                    observed_at=_aware(feature.captured_at), examined_count=1, rejected_count=1,\n                    rejection_reasons={"SIMULATED_EQUITY_INSUFFICIENT": 1},\n                    metadata={"mint": launch.mint, "stage": "capital"},\n                )\n                break\n            quote_attempts += 1\n            did_open = await self._attempt_entry(db, study, launch, feature, config)\n            if did_open:\n                opened += 1\n                record_scan_observation(\n                    db, study_id=study.id, external_key=candidate_key, observation_kind="candidate",\n                    observed_at=datetime.now(timezone.utc), examined_count=1, accepted_count=1,\n                    metadata={"mint": launch.mint, "stage": "delayed_execution", "status": "opened"},\n                )\n            else:\n                execution = db.scalar(\n                    select(ForwardExecutionRecord).where(\n                        ForwardExecutionRecord.study_id == study.id,\n                        ForwardExecutionRecord.external_key == self._entry_key(launch.signature),\n                    )\n                )\n                reason = "QUOTE_STAGE_REJECTED"\n                if execution is not None:\n                    reason = str(self._metadata(execution).get("reason") or reason)\n                record_scan_observation(\n                    db, study_id=study.id, external_key=candidate_key, observation_kind="candidate",\n                    observed_at=datetime.now(timezone.utc), examined_count=1, rejected_count=1,\n                    rejection_reasons={reason: 1},\n                    metadata={"mint": launch.mint, "stage": "delayed_execution"},\n                )\n        record_scan_observation(\n            db,\n            study_id=study.id,\n            external_key=cycle_key,\n            observation_kind="cycle",\n            observed_at=now,\n            metadata={\n                "launches_in_window": len(launches),\n                "features_ready": features_ready,\n                "quote_attempts": quote_attempts,\n                "opened": opened,\n            },\n        )\n        return opened, quote_attempts\n\n'''
          replace_between(
              "app/solana_forward.py",
              "    async def _attempt_new_entries(\n",
              "    async def run_study_once(\n",
              solana_method,
          )

          # Polymarket: distinguish broad market scanning from unique structural candidate decisions.
          replace_once(
              "app/polymarket_forward.py",
              "from app.services import HealthRegistry\n",
              "from app.services import HealthRegistry\nfrom app.scan_telemetry import record_scan_observation\n",
          )
          replace_once(
              "app/polymarket_forward.py",
              "        candidates = await self._discover_candidates(config)\n        attempts = 0\n        trades = 0\n",
              "        candidates, discovery_meta = await self._discover_candidates(config)\n        attempts = 0\n        trades = 0\n        examined = 0\n        accepted = 0\n        rejected = 0\n        deferred = 0\n        rejection_reasons: dict[str, int] = {}\n\n        def reject(reason: str) -> None:\n            nonlocal rejected\n            rejected += 1\n            rejection_reasons[reason] = rejection_reasons.get(reason, 0) + 1\n",
          )
          old_loop = '''        for candidate in candidates:\n            if attempts >= config.max_attempts_per_cycle:\n                break\n            if not self._signal_passes_cost_reserve(candidate.opportunity, config):\n                continue\n            attempt_key = self._attempt_key(candidate, config)\n            if self._attempt_exists(db, study.id, attempt_key):\n                continue\n            if self._required_capital(candidate.opportunity, config) > self._flat_equity(db, study):\n                continue\n            attempts += 1\n            if config.shadow_delay_ms:\n                await self.sleep(config.shadow_delay_ms / 1000)\n            shadow = await self._shadow_reprice(candidate, config)\n            traded = self._persist_attempt(db, study, candidate, shadow, config, attempt_key)\n            if traded:\n                trades += 1\n\n        self._record_hourly_flat_nav(db, study)\n'''
          new_loop = '''        for candidate in candidates:\n            if attempts >= config.max_attempts_per_cycle:\n                break\n            attempt_key = self._attempt_key(candidate, config)\n            candidate_key = f"pm-candidate:{attempt_key}"\n            if self._attempt_exists(db, study.id, attempt_key):\n                deferred += 1\n                continue\n            examined += 1\n            if not self._signal_passes_cost_reserve(candidate.opportunity, config):\n                reason = "SIGNAL_EDGE_AFTER_OPERATION_RESERVE_BELOW_THRESHOLD"\n                reject(reason)\n                record_scan_observation(\n                    db, study_id=study.id, external_key=candidate_key, observation_kind="candidate",\n                    observed_at=_aware(candidate.opportunity.captured_at), examined_count=1, rejected_count=1,\n                    rejection_reasons={reason: 1}, metadata={"kind": candidate.opportunity.kind, "stage": "signal_cost"},\n                )\n                continue\n            if self._required_capital(candidate.opportunity, config) > self._flat_equity(db, study):\n                reason = "SIMULATED_EQUITY_INSUFFICIENT"\n                reject(reason)\n                record_scan_observation(\n                    db, study_id=study.id, external_key=candidate_key, observation_kind="candidate",\n                    observed_at=_aware(candidate.opportunity.captured_at), examined_count=1, rejected_count=1,\n                    rejection_reasons={reason: 1}, metadata={"kind": candidate.opportunity.kind, "stage": "capital"},\n                )\n                continue\n            attempts += 1\n            if config.shadow_delay_ms:\n                await self.sleep(config.shadow_delay_ms / 1000)\n            shadow = await self._shadow_reprice(candidate, config)\n            traded = self._persist_attempt(db, study, candidate, shadow, config, attempt_key)\n            if traded:\n                trades += 1\n                accepted += 1\n                record_scan_observation(\n                    db, study_id=study.id, external_key=candidate_key, observation_kind="candidate",\n                    observed_at=max((row.observed_at for row in shadow), default=now),\n                    examined_count=1, accepted_count=1,\n                    metadata={"kind": candidate.opportunity.kind, "stage": "delayed_execution", "status": "completed"},\n                )\n            else:\n                reason = next((row.reason for row in shadow if row.reason), None) or "SHADOW_EDGE_OR_COST_GATE_FAILED"\n                reject(reason)\n                record_scan_observation(\n                    db, study_id=study.id, external_key=candidate_key, observation_kind="candidate",\n                    observed_at=max((row.observed_at for row in shadow), default=now),\n                    examined_count=1, rejected_count=1, rejection_reasons={reason: 1},\n                    metadata={"kind": candidate.opportunity.kind, "stage": "delayed_execution"},\n                )\n\n        record_scan_observation(\n            db, study_id=study.id,\n            external_key=f"polymarket-cycle:{int(_aware(now).timestamp() // 60)}",\n            observation_kind="cycle", observed_at=now, deferred_count=deferred,\n            metadata={**discovery_meta, "attempts": attempts, "trades": trades},\n        )\n        self._record_hourly_flat_nav(db, study)\n'''
          replace_once("app/polymarket_forward.py", old_loop, new_loop)
          replace_once(
              "app/polymarket_forward.py",
              "    async def _discover_candidates(self, config: PolymarketForwardConfig) -> list[StructuralCandidate]:\n",
              "    async def _discover_candidates(self, config: PolymarketForwardConfig) -> tuple[list[StructuralCandidate], dict[str, int]]:\n",
          )
          replace_once(
              "app/polymarket_forward.py",
              "        markets, _ = await research._validate_markets(discovered)\n        if not markets:\n",
              "        markets, _ = await research._validate_markets(discovered)\n        discovery_meta = {\"markets_discovered\": len(discovered), \"markets_validated\": len(markets)}\n        if not markets:\n",
          )
          replace_once(
              "app/polymarket_forward.py",
              "        return sorted(candidates, key=lambda row: row.opportunity.net_profit, reverse=True)\n",
              "        sorted_candidates = sorted(candidates, key=lambda row: row.opportunity.net_profit, reverse=True)\n        discovery_meta[\"structural_candidates\"] = len(sorted_candidates)\n        return sorted_candidates, discovery_meta\n",
          )

          # Hyperliquid: every worker cycle is visible, while entry evaluations carry pass/reject reasons.
          replace_once(
              "app/workers/hyperliquid_forward_runner.py",
              "import logging\n",
              "import logging\nfrom datetime import datetime, timezone\n",
          )
          replace_once(
              "app/workers/hyperliquid_forward_runner.py",
              "from app.services import HealthRegistry\n",
              "from app.services import HealthRegistry\nfrom app.scan_telemetry import normalize_reason, record_scan_observation\n",
          )
          old_hl_log = '''                for result in results:\n                    log.info(\n                        "Hyperliquid forward study %s: %s - %s",\n                        result.study_id,\n                        result.action,\n                        result.detail,\n                    )\n'''
          new_hl_log = '''                for result in results:\n                    observed_at = datetime.now(timezone.utc)\n                    record_scan_observation(\n                        db,\n                        study_id=result.study_id,\n                        external_key=f"hyperliquid-cycle:{int(observed_at.timestamp() // settings.hyperliquid_forward_poll_seconds)}",\n                        observation_kind="cycle",\n                        observed_at=observed_at,\n                        metadata={"action": result.action, "detail": result.detail},\n                    )\n                    if result.action in {"opened", "no_entry", "entry_rejected", "entry_rejected_capital"}:\n                        if result.action == "opened":\n                            accepted_count, rejected_count, reasons = 1, 0, {}\n                        else:\n                            accepted_count, rejected_count = 0, 1\n                            raw_reasons = str(result.detail).split(",") if result.action == "no_entry" else [result.detail]\n                            reasons = {normalize_reason(reason): 1 for reason in raw_reasons if str(reason).strip()}\n                        record_scan_observation(\n                            db,\n                            study_id=result.study_id,\n                            external_key=f"hyperliquid-candidate:{int(observed_at.timestamp() // settings.hyperliquid_forward_poll_seconds)}",\n                            observation_kind="candidate",\n                            observed_at=observed_at,\n                            examined_count=1,\n                            accepted_count=accepted_count,\n                            rejected_count=rejected_count,\n                            rejection_reasons=reasons,\n                            metadata={"action": result.action},\n                        )\n                    log.info(\n                        "Hyperliquid forward study %s: %s - %s",\n                        result.study_id,\n                        result.action,\n                        result.detail,\n                    )\n'''
          replace_once("app/workers/hyperliquid_forward_runner.py", old_hl_log, new_hl_log)

          # /research and typed research-snapshot now expose the durable 24h activity summary.
          replace_once(
              "app/research_snapshot.py",
              "from app.solana_forward_ops import study_statuses as solana_study_statuses\n",
              "from app.solana_forward_ops import study_statuses as solana_study_statuses\nfrom app.scan_telemetry import scan_activity_summary\n",
          )
          replace_once(
              "app/research_snapshot.py",
              '                "operational": _compact_operational(operational.get(study_id)),\n',
              '                "operational": _compact_operational(operational.get(study_id)),\n                "activity": scan_activity_summary(db, study_id=study_id, now=captured_at),\n',
          )
          old_after_eval = '''        hard = op.get("hard_reasons") or []\n        warnings = op.get("warnings") or []\n'''
          new_after_eval = '''        activity = row.get("activity") or {}\n        if activity.get("tracking"):\n            lines.append(\n                "Activity 24h: "\n                f"scans {activity.get('cycles', 0)} | "\n                f"examined {activity.get('examined', 0)} | "\n                f"passed {activity.get('accepted', 0)} | "\n                f"rejected {activity.get('rejected', 0)}"\n            )\n            meta = activity.get("metadata_totals") or {}\n            venue = str(row.get("venue") or "").lower()\n            if venue == "solana" and meta:\n                lines.append(\n                    "Scan detail: "\n                    f"launch-window observations {meta.get('launches_in_window', 0)} | "\n                    f"decision features {meta.get('features_ready', 0)} | "\n                    f"quote attempts {meta.get('quote_attempts', 0)}"\n                )\n            elif venue == "polymarket" and meta:\n                lines.append(\n                    "Scan detail: "\n                    f"markets discovered {meta.get('markets_discovered', 0)} | "\n                    f"validated {meta.get('markets_validated', 0)} | "\n                    f"structural candidates {meta.get('structural_candidates', 0)}"\n                )\n            top = activity.get("top_rejection_reasons") or []\n            if top:\n                lines.append(\n                    "Top rejects: " + "; ".join(\n                        f"{item.get('reason')} {item.get('count')}" for item in top[:5]\n                    )\n                )\n        else:\n            lines.append("Activity: tracking enabled; waiting for first completed scan")\n        hard = op.get("hard_reasons") or []\n        warnings = op.get("warnings") or []\n'''
          replace_once("app/research_snapshot.py", old_after_eval, new_after_eval)

          # Least-privilege readers need SELECT on only the new telemetry table, not broader access.
          for path in (
              "deploy/compose.dashboard-local.yml",
              "deploy/compose.dashboard-tunnel.yml",
              "deploy/compose.controls.yml",
          ):
              text = read(path)
              needle = "          forward_execution_records,\n"
              if "          forward_scan_observations,\n" not in text:
                  if needle not in text:
                      raise SystemExit(f"{path}: grant insertion point not found")
                  text = text.replace(needle, needle + "          forward_scan_observations,\n", 1)
                  write(path, text)

          # Existing deployment verifiers use explicit table allowlists. Add only this table.
          for path in ("deploy/preflight-forward.sh", "deploy/verify-forward.sh"):
              text = read(path)
              if "forward_scan_observations" not in text:
                  changed = text.replace('"forward_execution_records"', '"forward_execution_records","forward_scan_observations"')
                  if changed == text:
                      changed = text.replace("'forward_execution_records'", "'forward_execution_records','forward_scan_observations'")
                  if changed == text:
                      raise SystemExit(f"{path}: explicit dashboard table allowlist insertion point not found")
                  write(path, changed)

          # Focused tests: durability/idempotency, bounded summary, renderer, migration and grants.
          Path("tests/test_scan_telemetry.py").write_text('''from datetime import datetime, timedelta, timezone\n\nfrom sqlalchemy import create_engine\nfrom sqlalchemy.orm import Session\n\nimport app.forward_models\nfrom app.forward_models import ForwardStudy\nfrom app.models import Base\nfrom app.research_snapshot import render_research_snapshot_text\nfrom app.scan_telemetry import record_scan_observation, scan_activity_summary\n\nNOW = datetime(2026, 9, 3, 12, 0, tzinfo=timezone.utc)\n\n\ndef db_session() -> Session:\n    engine = create_engine("sqlite:///:memory:")\n    Base.metadata.create_all(engine)\n    db = Session(engine)\n    db.add(\n        ForwardStudy(\n            id="study-1", external_id="scan-test", strategy_version_id="version-1",\n            experiment_id="experiment-1", family="meme", venue="solana",\n            instrument="PUMP_LAUNCH_BASELINE", status="active", initial_capital_usd=1000,\n            evaluation_policy_json="{}", study_config_json="{}", started_at=NOW - timedelta(hours=2),\n        )\n    )\n    db.commit()\n    return db\n\n\ndef test_scan_observations_are_idempotent_and_summarized():\n    db = db_session()\n    first = record_scan_observation(\n        db, study_id="study-1", external_key="candidate:a", observation_kind="candidate",\n        observed_at=NOW - timedelta(minutes=2), examined_count=1, rejected_count=1,\n        rejection_reasons={"MINT_AUTHORITY_NOT_REVOKED": 1}, metadata={"stage": "safety"},\n    )\n    again = record_scan_observation(\n        db, study_id="study-1", external_key="candidate:a", observation_kind="candidate",\n        observed_at=NOW, examined_count=1, rejected_count=1,\n        rejection_reasons={"MINT_AUTHORITY_NOT_REVOKED": 1}, metadata={"stage": "safety"},\n    )\n    assert again.id == first.id\n    record_scan_observation(\n        db, study_id="study-1", external_key="candidate:b", observation_kind="candidate",\n        observed_at=NOW - timedelta(minutes=1), examined_count=1, accepted_count=1,\n    )\n    record_scan_observation(\n        db, study_id="study-1", external_key="cycle:1", observation_kind="cycle",\n        observed_at=NOW, metadata={"launches_in_window": 17, "features_ready": 2, "quote_attempts": 1},\n    )\n    activity = scan_activity_summary(db, study_id="study-1", now=NOW)\n    assert activity["cycles"] == 1\n    assert activity["examined"] == 2\n    assert activity["accepted"] == 1\n    assert activity["rejected"] == 1\n    assert activity["top_rejection_reasons"] == [{"reason": "MINT_AUTHORITY_NOT_REVOKED", "count": 1}]\n    assert activity["metadata_totals"]["launches_in_window"] == 17\n\n\ndef test_research_text_explains_zero_trade_scan_activity():\n    text = render_research_snapshot_text(\n        {\n            "captured_at": NOW,\n            "portfolio": {"simulated_latest_nav_usd": 1000, "net_pnl_usd": 0, "return_pct": 0, "unresolved_incidents": 0},\n            "studies": [{\n                "venue": "solana", "strategy_name": "Solana Pump Safety Baseline", "study_status": "active",\n                "latest_nav_usd": 1000, "net_pnl_usd": 0, "return_pct": 0, "closed_trades": 0,\n                "operational": {"state": "ready", "hard_reasons": [], "warnings": []},\n                "latest_evaluation": {},\n                "activity": {\n                    "tracking": True, "cycles": 12, "examined": 7, "accepted": 0, "rejected": 7,\n                    "metadata_totals": {"launches_in_window": 42, "features_ready": 7, "quote_attempts": 0},\n                    "top_rejection_reasons": [{"reason": "MINT_AUTHORITY_NOT_REVOKED", "count": 5}],\n                },\n            }],\n        }\n    )\n    assert "Activity 24h: scans 12 | examined 7 | passed 0 | rejected 7" in text\n    assert "launch-window observations 42" in text\n    assert "MINT_AUTHORITY_NOT_REVOKED 5" in text\n''')

          # Existing hosting tests should explicitly assert the new least-privilege read table.
          for path in ("tests/test_dashboard_hosting.py", "tests/test_research_snapshot.py"):
              text = read(path)
              if "forward_scan_observations" not in text:
                  marker = '"hyperliquid_carry_positions",'
                  if marker in text:
                      text = text.replace(marker, '"forward_scan_observations",\n        ' + marker, 1)
                  else:
                      # Some tests only hold a small required set; append a direct assertion instead.
                      text += '\n\ndef test_scan_telemetry_table_is_explicitly_granted_to_reader_roles():\n    for name in ("compose.dashboard-local.yml", "compose.dashboard-tunnel.yml", "compose.controls.yml"):\n        assert "forward_scan_observations" in (ROOT / "deploy" / name).read_text()\n'
                  write(path, text)

          # Self-delete before the implementation commit: no persistent Actions workflow remains.
          Path(".github/workflows/implement-research-scan-telemetry-once.yml").unlink()
          PY
      - name: Install
        run: pip install -e . pytest
      - name: Focused telemetry tests
        run: pytest -q tests/test_scan_telemetry.py tests/test_research_snapshot.py tests/test_dashboard_hosting.py tests/test_deployment_preflight.py
      - name: Compile
        run: python -m compileall -q app tests
      - name: Fresh Alembic migration
        env:
          DATABASE_URL: postgresql+psycopg://edge:edge_test_password@127.0.0.1:5432/edge
        run: alembic upgrade head
      - name: Full repository verification
        run: sh scripts/verify-repo.sh
      - name: Ensure safety boundary and no workflow residue
        run: |
          test ! -e .github/workflows/implement-research-scan-telemetry-once.yml
          grep -q 'signer_enabled: bool = False' app/config.py
          ! grep -R --line-number --exclude-dir=.git -E 'sendTransaction|/execute' app/scan_telemetry.py app/research_snapshot.py
      - name: Commit verified implementation
        run: |
          git config user.name "TropicalKenny"
          git config user.email "138382176+TropicalKenny@users.noreply.github.com"
          git add -A
          git commit -m "feat: add research scan telemetry"
          git push origin HEAD:feat/research-scan-telemetry
