name: Verify Hyperliquid Spot Index Identity

on:
  push:
    branches:
      - fix/hyperliquid-spot-index-identity

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e . pytest
      - name: Full repository verification
        run: sh scripts/verify-repo.sh
