name: Apply bounded Polymarket WS frame fix

on:
  push:
    branches: [fix/m6k-polymarket-ws-frame-limit]
    paths:
      - '.github/workflows/tmp-m6k-pm-ws-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m6k-polymarket-ws-frame-limit
          fetch-depth: 0
      - name: Patch worker and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('app/workers/m6j_polymarket_research.py')
          text = worker.read_text()
          old = '    async with websockets.connect(MARKET_WS_URL, ping_interval=None, close_timeout=5) as ws:\n'
          new = '''    # Polymarket can send an initial multi-book snapshot slightly above the\n    # websockets library's 1 MiB default. Keep a finite 4 MiB ceiling rather than\n    # disabling message limits, so malformed/unbounded frames still fail closed.\n    async with websockets.connect(\n        MARKET_WS_URL,\n        ping_interval=None,\n        close_timeout=5,\n        max_size=4 * 1024 * 1024,\n    ) as ws:\n'''
          if old not in text:
              raise SystemExit('expected websocket connect line not found')
          worker.write_text(text.replace(old, new, 1))

          tests = Path('tests/test_m6j_deployment.py')
          text = tests.read_text()
          marker = 'def test_polymarket_research_websocket_uses_bounded_large_frame_limit():'
          if marker not in text:
              text += '''\n\ndef test_polymarket_research_websocket_uses_bounded_large_frame_limit():\n    text = (ROOT / "app" / "workers" / "m6j_polymarket_research.py").read_text()\n    assert "max_size=4 * 1024 * 1024" in text\n    assert "max_size=None" not in text\n'''
          tests.write_text(text)
          PY

          git config user.name 'TropicalKenny'
          git config user.email '138382176+TropicalKenny@users.noreply.github.com'
          git rm .github/workflows/tmp-m6k-pm-ws-fix.yml
          git add app/workers/m6j_polymarket_research.py tests/test_m6j_deployment.py
          git diff --cached --check
          git commit -m 'fix: allow bounded larger Polymarket websocket snapshots'
          git push origin HEAD:fix/m6k-polymarket-ws-frame-limit
