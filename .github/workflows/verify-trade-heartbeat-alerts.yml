name: Verify Telegram Trade Heartbeat Alerts

on:
  push:
    branches:
      - feat/telegram-trade-heartbeat-alerts
    paths:
      - .github/workflows/verify-trade-heartbeat-alerts.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e . pytest
      - name: Full repository verification
        run: sh scripts/verify-repo.sh
