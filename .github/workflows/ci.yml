name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q app tests
      - name: Fresh migration
        env:
          DATABASE_URL: sqlite:////tmp/edge_lab_ci.db
        run: alembic upgrade head
      - name: Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password-long-enough
          FORWARD_INGEST_SECRET: ci-forward-ingest-secret-long-enough
          DASHBOARD_DB_PASSWORD: ci-dashboard-password-separate-long-enough
          CLOUDFLARE_TUNNEL_TOKEN: ci-tunnel-token
          HELIUS_API_KEY: ci-helius
          JUPITER_API_KEY: ci-jupiter
          SIGNER_ENABLED: 'false'
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deploy/compose.forward.yml \
            -f deploy/compose.solana-forward.yml \
            -f deploy/compose.dashboard-tunnel.yml \
            --profile forward \
            --profile solana \
            --profile dashboard \
            config >/dev/null
