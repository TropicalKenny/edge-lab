name: Verify Research Snapshot Bridge

on:
  push:
    branches:
      - feat/research-snapshot-bridge

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e . pytest
      - name: Full repository verification
        run: sh scripts/verify-repo.sh
