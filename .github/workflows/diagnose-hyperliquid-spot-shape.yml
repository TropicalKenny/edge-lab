name: Diagnose Hyperliquid Spot Shape

on:
  push:
    branches:
      - fix/hyperliquid-orphan-contexts

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current-market context coverage
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          def post(payload):
              req = urllib.request.Request(
                  'https://api.hyperliquid.xyz/info',
                  data=json.dumps(payload).encode(),
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          meta, contexts = post({'type': 'spotMetaAndAssetCtxs'})
          mids = post({'type': 'allMids'})
          universe = meta.get('universe', [])
          tokens = meta.get('tokens', [])
          token_by_index = {int(t['index']): t for t in tokens if isinstance(t, dict) and 'index' in t}
          context_by_coin = {
              str(c.get('coin')): c for c in contexts
              if isinstance(c, dict) and c.get('coin') is not None
          }

          coverage = {'market_name': 0, 'base_index': 0, 'base_name': 0, 'pair_name': 0, 'any': 0}
          uncovered = []
          quote_counts = {}
          for market in universe:
              if not isinstance(market, dict):
                  continue
              ids = market.get('tokens') or []
              if len(ids) != 2:
                  continue
              base_i, quote_i = map(int, ids)
              base = token_by_index.get(base_i, {}).get('name')
              quote = token_by_index.get(quote_i, {}).get('name')
              pair = f'{base}/{quote}' if base and quote else None
              names = {
                  'market_name': str(market.get('name', '')),
                  'base_index': f'@{base_i}',
                  'base_name': str(base or ''),
                  'pair_name': str(pair or ''),
              }
              hit = False
              for key, identity in names.items():
                  if identity and identity in context_by_coin:
                      coverage[key] += 1
                      hit = True
              coverage['any'] += int(hit)
              if not hit:
                  uncovered.append({'market': market, 'base': base, 'quote': quote})
              quote_counts[quote] = quote_counts.get(quote, 0) + 1

          print('universe_count=', len(universe))
          print('context_count=', len(contexts))
          print('coverage=', json.dumps(coverage, sort_keys=True))
          print('uncovered_count=', len(uncovered))
          print('uncovered_sample=', json.dumps(uncovered[:10], sort_keys=True))
          print('quote_counts=', json.dumps(quote_counts, sort_keys=True))

          interesting = {'UBTC', 'BTC', 'HYPE', 'USDC'}
          for token in tokens:
              if isinstance(token, dict) and token.get('name') in interesting:
                  idx = int(token['index'])
                  related = [m for m in universe if isinstance(m, dict) and idx in (m.get('tokens') or [])]
                  print('TOKEN', token.get('name'), 'index=', idx, 'meta=', json.dumps(token, sort_keys=True))
                  print('RELATED_MARKETS=', json.dumps(related, sort_keys=True))
                  candidate_ids = {f'@{idx}', token.get('name')}
                  for market in related:
                      candidate_ids.add(str(market.get('name', '')))
                      candidate_ids.add('@' + str(market.get('index')))
                  for identity in sorted(x for x in candidate_ids if x):
                      if identity in context_by_coin or identity in mids:
                          print('IDENTITY', identity,
                                'context=', json.dumps(context_by_coin.get(identity), sort_keys=True),
                                'mid=', json.dumps(mids.get(identity)))
          PY
