name: Diagnose Hyperliquid Spot Shape

on:
  push:
    branches:
      - fix/hyperliquid-orphan-contexts

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public spot market-index alignment
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          req = urllib.request.Request(
              'https://api.hyperliquid.xyz/info',
              data=json.dumps({'type': 'spotMetaAndAssetCtxs'}).encode(),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              meta, contexts = json.load(response)

          universe = meta.get('universe', [])
          tokens = meta.get('tokens', [])
          token_by_index = {
              int(t['index']): t for t in tokens
              if isinstance(t, dict) and 'index' in t
          }

          missing_index = 0
          out_of_range = 0
          non_dict_context = 0
          identity_mismatches = []
          samples = []
          for market in universe:
              if not isinstance(market, dict):
                  continue
              try:
                  market_index = int(market['index'])
              except (KeyError, TypeError, ValueError):
                  missing_index += 1
                  continue
              if market_index < 0 or market_index >= len(contexts):
                  out_of_range += 1
                  continue
              ctx = contexts[market_index]
              if not isinstance(ctx, dict):
                  non_dict_context += 1
                  continue

              token_ids = market.get('tokens') or []
              base_idx = int(token_ids[0]) if isinstance(token_ids, list) and len(token_ids) == 2 else None
              base = token_by_index.get(base_idx) if base_idx is not None else None
              base_name = base.get('name') if isinstance(base, dict) else None
              coin = str(ctx.get('coin', '')).strip()
              expected_coin_ids = {str(market.get('name', '')).strip()}
              if base_name:
                  expected_coin_ids.add(str(base_name))
              if base_idx is not None:
                  expected_coin_ids.add('@' + str(base_idx))

              if coin and coin not in expected_coin_ids:
                  identity_mismatches.append({
                      'market_index': market_index,
                      'market_name': market.get('name'),
                      'base_index': base_idx,
                      'base_name': base_name,
                      'context_coin': coin,
                  })
              if len(samples) < 20:
                  samples.append({
                      'market_index': market_index,
                      'market_name': market.get('name'),
                      'base_index': base_idx,
                      'base_name': base_name,
                      'context_coin': coin,
                      'midPx': ctx.get('midPx'),
                      'markPx': ctx.get('markPx'),
                  })

          print('universe_count=', len(universe))
          print('context_count=', len(contexts))
          print('missing_market_index=', missing_index)
          print('out_of_range_market_index=', out_of_range)
          print('non_dict_context=', non_dict_context)
          print('identity_mismatch_count=', len(identity_mismatches))
          print('identity_mismatch_sample=', json.dumps(identity_mismatches[:20], sort_keys=True))
          print('aligned_samples=', json.dumps(samples, sort_keys=True))

          target = next((m for m in universe if isinstance(m, dict) and int(m.get('index', -1)) == 114), None)
          print('market_114=', json.dumps(target, sort_keys=True))
          print('context_114=', json.dumps(contexts[114] if len(contexts) > 114 else None, sort_keys=True))
          PY
