name: Diagnose Hyperliquid Spot Shape

on:
  push:
    branches:
      - fix/hyperliquid-orphan-contexts

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correlate public spot contexts with metadata
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          req = urllib.request.Request(
              'https://api.hyperliquid.xyz/info',
              data=json.dumps({'type': 'spotMetaAndAssetCtxs'}).encode(),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              meta, contexts = json.load(response)

          universe = meta.get('universe', [])
          tokens = meta.get('tokens', [])
          token_by_index = {
              int(t['index']): t for t in tokens
              if isinstance(t, dict) and 'index' in t
          }
          market_by_index = {
              int(m['index']): m for m in universe
              if isinstance(m, dict) and 'index' in m
          }

          def numeric_coin(coin):
              if isinstance(coin, str) and coin.startswith('@'):
                  try:
                      return int(coin[1:])
                  except ValueError:
                      return None
              return None

          numeric_contexts = []
          token_hits = 0
          market_hits = 0
          both_hits = 0
          neither_hits = 0
          for ctx in contexts:
              if not isinstance(ctx, dict):
                  continue
              idx = numeric_coin(ctx.get('coin'))
              if idx is None:
                  continue
              numeric_contexts.append(idx)
              th = idx in token_by_index
              mh = idx in market_by_index
              token_hits += int(th)
              market_hits += int(mh)
              both_hits += int(th and mh)
              neither_hits += int(not th and not mh)

          idx = 71
          markets_with_token_71 = [
              m for m in universe
              if isinstance(m, dict) and idx in (m.get('tokens') or [])
          ]
          token71 = token_by_index.get(idx)
          market71 = market_by_index.get(idx)
          ctx71 = [c for c in contexts if isinstance(c, dict) and c.get('coin') == '@71']

          print('universe_count=', len(universe))
          print('token_count=', len(tokens))
          print('context_count=', len(contexts))
          print('numeric_context_count=', len(numeric_contexts))
          print('numeric_context_token_index_hits=', token_hits)
          print('numeric_context_market_index_hits=', market_hits)
          print('numeric_context_both_hits=', both_hits)
          print('numeric_context_neither_hits=', neither_hits)
          print('token_index_71=', json.dumps(token71, sort_keys=True))
          print('market_index_71=', json.dumps(market71, sort_keys=True))
          print('markets_containing_token_71=', json.dumps(markets_with_token_71[:10], sort_keys=True))
          print('context_at_71=', json.dumps(ctx71[:2], sort_keys=True))

          # Show a few numeric contexts with their token and market interpretations.
          for sample_idx in numeric_contexts[:12]:
              print('sample=', sample_idx,
                    'token=', json.dumps(token_by_index.get(sample_idx), sort_keys=True),
                    'market=', json.dumps(market_by_index.get(sample_idx), sort_keys=True))
          PY
