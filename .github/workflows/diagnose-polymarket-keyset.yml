name: Diagnose Polymarket Keyset Contract

on:
  push:
    branches:
      - fix/polymarket-gamma-keyset-contract

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe public Gamma keyset query contract
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          base = 'https://gamma-api.polymarket.com/markets/keyset'
          cases = {
              'minimal': {'limit': 2, 'closed': 'false'},
              'snake_sort': {'limit': 2, 'closed': 'false', 'order': 'liquidity_num', 'ascending': 'false'},
              'camel_sort': {'limit': 2, 'closed': 'false', 'order': 'liquidityNum', 'ascending': 'false'},
              'plain_sort': {'limit': 2, 'closed': 'false', 'order': 'liquidity', 'ascending': 'false'},
              'volume_sort': {'limit': 2, 'closed': 'false', 'order': 'volume', 'ascending': 'false'},
              'volume_num_sort': {'limit': 2, 'closed': 'false', 'order': 'volume_num', 'ascending': 'false'},
              'active_minimal': {'limit': 2, 'active': 'true', 'closed': 'false'},
          }

          for name, params in cases.items():
              url = base + '?' + urllib.parse.urlencode(params)
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'edge-lab-public-api-diagnostic/1'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read().decode('utf-8', errors='replace')
                      status = response.status
                  try:
                      body = json.loads(raw)
                      if isinstance(body, dict):
                          summary = {
                              'keys': sorted(body.keys()),
                              'market_count': len(body.get('markets') or []) if isinstance(body.get('markets'), list) else None,
                              'has_next_cursor': bool(body.get('next_cursor')),
                          }
                      else:
                          summary = {'type': type(body).__name__, 'count': len(body) if isinstance(body, list) else None}
                  except json.JSONDecodeError:
                      summary = {'raw': raw[:500]}
                  print(name, 'status=', status, 'summary=', json.dumps(summary, sort_keys=True))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  print(name, 'status=', exc.code, 'error=', body[:1000])
              except Exception as exc:
                  print(name, 'exception=', type(exc).__name__, str(exc)[:300])
          PY
