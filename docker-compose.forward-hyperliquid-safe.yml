services:
  hyperliquid-carry-forward:
    profiles: ["forward-hyperliquid"]
    build: .
    command: ["python", "-m", "app.workers.hyperliquid_carry_forward_safe"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      HYPERLIQUID_NETWORK: ${HYPERLIQUID_NETWORK:-mainnet}
      HYPERLIQUID_TIMEOUT_SECONDS: ${HYPERLIQUID_TIMEOUT_SECONDS:-10}
      HYPERLIQUID_MARKET_POLL_SECONDS: ${HYPERLIQUID_MARKET_POLL_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
