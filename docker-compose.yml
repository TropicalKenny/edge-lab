services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edge
      POSTGRES_PASSWORD: edge
      POSTGRES_DB: edge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge -d edge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      HYPERLIQUID_NETWORK: mainnet
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      GOPLUS_ACCESS_TOKEN: ${GOPLUS_ACCESS_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  hyperliquid-collector:
    build: .
    command: ["python", "-m", "app.workers.hyperliquid_collector"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      HYPERLIQUID_NETWORK: mainnet
      HYPERLIQUID_MARKET_POLL_SECONDS: "60"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  hyperliquid-forward-bootstrap:
    profiles: ["forward"]
    build: .
    command: ["python", "-m", "app.forward_ops", "bootstrap"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      SIGNER_ENABLED: "false"
      HYPERLIQUID_FORWARD_STUDY_EXTERNAL_ID: ${HYPERLIQUID_FORWARD_STUDY_EXTERNAL_ID:-hyperliquid-btc-carry-m6c-v1}
      HYPERLIQUID_FORWARD_INSTRUMENT: ${HYPERLIQUID_FORWARD_INSTRUMENT:-BTC}
      HYPERLIQUID_FORWARD_INITIAL_CAPITAL_USD: ${HYPERLIQUID_FORWARD_INITIAL_CAPITAL_USD:-1000}
      HYPERLIQUID_FORWARD_PAIRED_NOTIONAL_USD: ${HYPERLIQUID_FORWARD_PAIRED_NOTIONAL_USD:-100}
      HYPERLIQUID_FORWARD_HORIZON_HOURS: ${HYPERLIQUID_FORWARD_HORIZON_HOURS:-24}
      HYPERLIQUID_FORWARD_MIN_EDGE_BPS: ${HYPERLIQUID_FORWARD_MIN_EDGE_BPS:-10}
      HYPERLIQUID_FORWARD_PLANNED_LOSS_PCT: ${HYPERLIQUID_FORWARD_PLANNED_LOSS_PCT:-0.02}
      HYPERLIQUID_FORWARD_SPOT_FEE_BPS: ${HYPERLIQUID_FORWARD_SPOT_FEE_BPS:-7}
      HYPERLIQUID_FORWARD_PERP_FEE_BPS: ${HYPERLIQUID_FORWARD_PERP_FEE_BPS:-4.5}
      HYPERLIQUID_FORWARD_SLIPPAGE_RESERVE_BPS_PER_LEG: ${HYPERLIQUID_FORWARD_SLIPPAGE_RESERVE_BPS_PER_LEG:-2}
      HYPERLIQUID_FORWARD_SHADOW_DELAY_MS: ${HYPERLIQUID_FORWARD_SHADOW_DELAY_MS:-1000}
      HYPERLIQUID_FORWARD_MAX_EXIT_DELAY_HOURS: ${HYPERLIQUID_FORWARD_MAX_EXIT_DELAY_HOURS:-6}
      HYPERLIQUID_FORWARD_MAX_FUNDING_ORACLE_AGE_MINUTES: ${HYPERLIQUID_FORWARD_MAX_FUNDING_ORACLE_AGE_MINUTES:-5}
      EVALUATION_MIN_FORWARD_DAYS: ${EVALUATION_MIN_FORWARD_DAYS:-90}
      EVALUATION_MIN_NAV_OBSERVATIONS: ${EVALUATION_MIN_NAV_OBSERVATIONS:-60}
      EVALUATION_MIN_SHADOW_OBSERVATIONS: ${EVALUATION_MIN_SHADOW_OBSERVATIONS:-30}
      EVALUATION_MIN_TRADES_DEFAULT: ${EVALUATION_MIN_TRADES_DEFAULT:-100}
      EVALUATION_MIN_TRADES_FUNDING: ${EVALUATION_MIN_TRADES_FUNDING:-60}
      EVALUATION_MIN_TRADES_DIRECTIONAL: ${EVALUATION_MIN_TRADES_DIRECTIONAL:-100}
      EVALUATION_MIN_TRADES_MEME: ${EVALUATION_MIN_TRADES_MEME:-300}
      EVALUATION_MIN_FORECASTS_PREDICTION: ${EVALUATION_MIN_FORECASTS_PREDICTION:-50}
      EVALUATION_MAX_DRAWDOWN_PCT: ${EVALUATION_MAX_DRAWDOWN_PCT:-0.15}
      EVALUATION_MIN_PROFIT_FACTOR: ${EVALUATION_MIN_PROFIT_FACTOR:-1.30}
      EVALUATION_MAX_TOP3_PROFIT_CONCENTRATION: ${EVALUATION_MAX_TOP3_PROFIT_CONCENTRATION:-0.50}
      EVALUATION_COST_STRESS_MULTIPLIER: ${EVALUATION_COST_STRESS_MULTIPLIER:-2.0}
      EVALUATION_MIN_SHADOW_FILL_RATIO: ${EVALUATION_MIN_SHADOW_FILL_RATIO:-0.90}
      EVALUATION_MAX_SHADOW_P90_PRICE_DIVERGENCE_BPS: ${EVALUATION_MAX_SHADOW_P90_PRICE_DIVERGENCE_BPS:-50}
      EVALUATION_MAX_PREDICTION_CALIBRATION_ERROR: ${EVALUATION_MAX_PREDICTION_CALIBRATION_ERROR:-0.10}
      EVALUATION_MAX_NAV_GAP_DAYS: ${EVALUATION_MAX_NAV_GAP_DAYS:-3.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  hyperliquid-forward-runner:
    profiles: ["forward"]
    build: .
    command: ["python", "-m", "app.workers.hyperliquid_forward_runner"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      HYPERLIQUID_NETWORK: mainnet
      HYPERLIQUID_FORWARD_POLL_SECONDS: ${HYPERLIQUID_FORWARD_POLL_SECONDS:-300}
      HYPERLIQUID_FORWARD_STUDY_EXTERNAL_ID: ${HYPERLIQUID_FORWARD_STUDY_EXTERNAL_ID:-hyperliquid-btc-carry-m6c-v1}
      FORWARD_STATUS_MAX_MARKET_AGE_SECONDS: ${FORWARD_STATUS_MAX_MARKET_AGE_SECONDS:-900}
    depends_on:
      hyperliquid-forward-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -m app.forward_ops status --external-id \"$${HYPERLIQUID_FORWARD_STUDY_EXTERNAL_ID}\" --require-ready --quiet"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  polymarket-collector:
    build: .
    command: ["python", "-m", "app.workers.polymarket_collector"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      POLYMARKET_SCAN_SECONDS: "60"
      POLYMARKET_MAX_MARKETS: "50"
      POLYMARKET_MAX_NEGRISK_EVENTS: "8"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  polymarket-forward-bootstrap:
    profiles: ["forward"]
    build: .
    command: ["python", "-m", "app.workers.polymarket_forward_bootstrap"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      SIGNER_ENABLED: "false"
      POLYMARKET_FORWARD_STUDY_EXTERNAL_ID: ${POLYMARKET_FORWARD_STUDY_EXTERNAL_ID:-polymarket-structural-m6f-v1}
      POLYMARKET_FORWARD_INITIAL_CAPITAL_USD: ${POLYMARKET_FORWARD_INITIAL_CAPITAL_USD:-1000}
      POLYMARKET_FORWARD_FEE_BUFFER_PCT: ${POLYMARKET_FORWARD_FEE_BUFFER_PCT:-2}
      POLYMARKET_FORWARD_SHADOW_DELAY_MS: ${POLYMARKET_FORWARD_SHADOW_DELAY_MS:-1000}
      POLYMARKET_FORWARD_OPERATION_COST_USD: ${POLYMARKET_FORWARD_OPERATION_COST_USD:-0.25}
      POLYMARKET_FORWARD_PLANNED_LOSS_PCT: ${POLYMARKET_FORWARD_PLANNED_LOSS_PCT:-0.02}
      POLYMARKET_FORWARD_ATTEMPT_INTERVAL_SECONDS: ${POLYMARKET_FORWARD_ATTEMPT_INTERVAL_SECONDS:-300}
      POLYMARKET_FORWARD_MAX_ATTEMPTS_PER_CYCLE: ${POLYMARKET_FORWARD_MAX_ATTEMPTS_PER_CYCLE:-3}
      POLYMARKET_MAX_MARKETS: ${POLYMARKET_MAX_MARKETS:-50}
      POLYMARKET_MAX_NEGRISK_EVENTS: ${POLYMARKET_MAX_NEGRISK_EVENTS:-8}
      POLYMARKET_MAX_SHARES_PER_OPPORTUNITY: ${POLYMARKET_MAX_SHARES_PER_OPPORTUNITY:-100}
      POLYMARKET_MIN_EDGE_BPS: ${POLYMARKET_MIN_EDGE_BPS:-10}
      POLYMARKET_MAX_BOOK_AGE_SECONDS: ${POLYMARKET_MAX_BOOK_AGE_SECONDS:-10}
      EVALUATION_MIN_FORWARD_DAYS: ${EVALUATION_MIN_FORWARD_DAYS:-90}
      EVALUATION_MIN_NAV_OBSERVATIONS: ${EVALUATION_MIN_NAV_OBSERVATIONS:-60}
      EVALUATION_MIN_SHADOW_OBSERVATIONS: ${EVALUATION_MIN_SHADOW_OBSERVATIONS:-30}
      EVALUATION_MIN_TRADES_DEFAULT: ${EVALUATION_MIN_TRADES_DEFAULT:-100}
      EVALUATION_MIN_TRADES_FUNDING: ${EVALUATION_MIN_TRADES_FUNDING:-60}
      EVALUATION_MIN_TRADES_DIRECTIONAL: ${EVALUATION_MIN_TRADES_DIRECTIONAL:-100}
      EVALUATION_MIN_TRADES_MEME: ${EVALUATION_MIN_TRADES_MEME:-300}
      EVALUATION_MIN_FORECASTS_PREDICTION: ${EVALUATION_MIN_FORECASTS_PREDICTION:-50}
      EVALUATION_MAX_DRAWDOWN_PCT: ${EVALUATION_MAX_DRAWDOWN_PCT:-0.15}
      EVALUATION_MIN_PROFIT_FACTOR: ${EVALUATION_MIN_PROFIT_FACTOR:-1.30}
      EVALUATION_MAX_TOP3_PROFIT_CONCENTRATION: ${EVALUATION_MAX_TOP3_PROFIT_CONCENTRATION:-0.50}
      EVALUATION_COST_STRESS_MULTIPLIER: ${EVALUATION_COST_STRESS_MULTIPLIER:-2.0}
      EVALUATION_MIN_SHADOW_FILL_RATIO: ${EVALUATION_MIN_SHADOW_FILL_RATIO:-0.90}
      EVALUATION_MAX_SHADOW_P90_PRICE_DIVERGENCE_BPS: ${EVALUATION_MAX_SHADOW_P90_PRICE_DIVERGENCE_BPS:-50}
      EVALUATION_MAX_PREDICTION_CALIBRATION_ERROR: ${EVALUATION_MAX_PREDICTION_CALIBRATION_ERROR:-0.10}
      EVALUATION_MAX_NAV_GAP_DAYS: ${EVALUATION_MAX_NAV_GAP_DAYS:-3.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  polymarket-forward-runner:
    profiles: ["forward"]
    build: .
    command: ["python", "-m", "app.workers.polymarket_forward_runner"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      POLYMARKET_TIMEOUT_SECONDS: ${POLYMARKET_TIMEOUT_SECONDS:-10}
      POLYMARKET_FORWARD_POLL_SECONDS: ${POLYMARKET_FORWARD_POLL_SECONDS:-60}
    depends_on:
      polymarket-forward-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  forward-evaluator:
    profiles: ["forward"]
    build: .
    command: ["python", "-m", "app.workers.forward_evaluator"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      SIGNER_ENABLED: "false"
      FORWARD_EVALUATION_POLL_SECONDS: ${FORWARD_EVALUATION_POLL_SECONDS:-3600}
    depends_on:
      hyperliquid-forward-bootstrap:
        condition: service_completed_successfully
      polymarket-forward-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  solana-launch-collector:
    profiles: ["solana"]
    build: .
    command: ["python", "-m", "app.workers.solana_launch_collector"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      SIGNER_ENABLED: "false"
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      HELIUS_COMMITMENT: confirmed
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  solana-forensic-sampler:
    profiles: ["solana"]
    build: .
    command: ["python", "-m", "app.workers.solana_forensic_sampler"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      SIGNER_ENABLED: "false"
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      GOPLUS_ACCESS_TOKEN: ${GOPLUS_ACCESS_TOKEN:-}
      SOLANA_FORENSIC_POLL_SECONDS: "300"
      SOLANA_ENRICHMENT_SAMPLE_MODULO: "50"
      SOLANA_MAX_ENRICHMENTS_PER_CYCLE: "20"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
