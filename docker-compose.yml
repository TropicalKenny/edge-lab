services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edge
      POSTGRES_PASSWORD: edge
      POSTGRES_DB: edge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge -d edge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      HYPERLIQUID_NETWORK: mainnet
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  hyperliquid-collector:
    build: .
    command: ["python", "-m", "app.workers.hyperliquid_collector"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      HYPERLIQUID_NETWORK: mainnet
      HYPERLIQUID_MARKET_POLL_SECONDS: "60"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  polymarket-collector:
    build: .
    command: ["python", "-m", "app.workers.polymarket_collector"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:edge@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      POLYMARKET_SCAN_SECONDS: "60"
      POLYMARKET_MAX_MARKETS: "50"
      POLYMARKET_MAX_NEGRISK_EVENTS: "8"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
