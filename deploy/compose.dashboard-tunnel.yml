services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["dashboard"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    depends_on:
      api:
        condition: service_started
    ports: []
    restart: unless-stopped
