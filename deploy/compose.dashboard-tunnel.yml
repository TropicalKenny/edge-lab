services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["dashboard"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    depends_on:
      dashboard:
        condition: service_healthy
    ports: []
    networks:
      - dashboard_gateway
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
