services:
  dashboard-db-role:
    image: postgres:16-alpine
    profiles: ["dashboard-local"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:?set DASHBOARD_DB_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -h postgres -U edge -d edge -v ON_ERROR_STOP=1 <<'SQL'
        \getenv dashboard_password DASHBOARD_DB_PASSWORD
        SELECT format('CREATE ROLE edge_dashboard LOGIN PASSWORD %L', :'dashboard_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'edge_dashboard') \gexec
        SELECT format('ALTER ROLE edge_dashboard PASSWORD %L', :'dashboard_password') \gexec
        ALTER ROLE edge_dashboard NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
        ALTER ROLE edge_dashboard SET default_transaction_read_only = on;
        ALTER ROLE edge_dashboard SET statement_timeout = '5s';
        ALTER ROLE edge_dashboard SET idle_in_transaction_session_timeout = '10s';
        GRANT CONNECT ON DATABASE edge TO edge_dashboard;
        GRANT USAGE ON SCHEMA public TO edge_dashboard;
        REVOKE ALL ON ALL TABLES IN SCHEMA public FROM edge_dashboard;
        REVOKE ALL ON ALL SEQUENCES IN SCHEMA public FROM edge_dashboard;
        ALTER DEFAULT PRIVILEGES FOR ROLE edge IN SCHEMA public REVOKE SELECT ON TABLES FROM edge_dashboard;
        GRANT SELECT ON TABLE
          strategies,
          strategy_versions,
          strategy_evaluation_runs,
          forward_studies,
          forward_nav_observations,
          forward_study_incidents,
          forward_trade_records,
          forward_execution_records
        TO edge_dashboard;
        SQL
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: []
    restart: "no"

  dashboard:
    profiles: ["dashboard-local"]
    build: .
    command: ["uvicorn", "app.dashboard_server:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge_dashboard:${DASHBOARD_DB_PASSWORD}@postgres:5432/edge
      SIGNER_ENABLED: "false"
    depends_on:
      dashboard-db-role:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read(32)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:8080:8080"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
