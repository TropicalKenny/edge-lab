services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: []

  redis:
    restart: unless-stopped
    ports: []

  migrate:
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      FORWARD_INGEST_SECRET: ${FORWARD_INGEST_SECRET:?set FORWARD_INGEST_SECRET}
      HYPERLIQUID_NETWORK: mainnet
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      GOPLUS_ACCESS_TOKEN: ${GOPLUS_ACCESS_TOKEN:-}
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  hyperliquid-collector:
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      HYPERLIQUID_NETWORK: mainnet
      HYPERLIQUID_MARKET_POLL_SECONDS: "60"
    restart: unless-stopped

  hyperliquid-forward-bootstrap:
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge
      SIGNER_ENABLED: "false"

  hyperliquid-forward-runner:
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      HYPERLIQUID_NETWORK: mainnet
      HYPERLIQUID_FORWARD_POLL_SECONDS: "300"
    restart: unless-stopped

  polymarket-collector:
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      POLYMARKET_SCAN_SECONDS: "60"
      POLYMARKET_MAX_MARKETS: "50"
      POLYMARKET_MAX_NEGRISK_EVENTS: "8"
    restart: unless-stopped

  polymarket-forward-bootstrap:
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge
      SIGNER_ENABLED: "false"

  polymarket-forward-runner:
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      POLYMARKET_TIMEOUT_SECONDS: ${POLYMARKET_TIMEOUT_SECONDS:-10}
      POLYMARKET_FORWARD_POLL_SECONDS: ${POLYMARKET_FORWARD_POLL_SECONDS:-60}
    restart: unless-stopped

  forward-evaluator:
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge
      SIGNER_ENABLED: "false"
      FORWARD_EVALUATION_POLL_SECONDS: ${FORWARD_EVALUATION_POLL_SECONDS:-3600}
    restart: unless-stopped

  db-backup:
    image: postgres:16-alpine
    profiles: ["forward"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump -h postgres -U edge -d edge -Fc -f "/backups/edge-$${stamp}.dump"
          find /backups -type f -name 'edge-*.dump' -mtime +14 -delete
          sleep 21600
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
