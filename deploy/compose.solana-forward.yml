services:
  solana-launch-collector:
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge
      SIGNER_ENABLED: "false"
      HELIUS_API_KEY: ${HELIUS_API_KEY:?set HELIUS_API_KEY}
      HELIUS_COMMITMENT: ${HELIUS_COMMITMENT:-confirmed}
    restart: unless-stopped

  solana-forensic-sampler:
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge
      SIGNER_ENABLED: "false"
      HELIUS_API_KEY: ${HELIUS_API_KEY:?set HELIUS_API_KEY}
      JUPITER_API_KEY: ${JUPITER_API_KEY:?set JUPITER_API_KEY}
      GOPLUS_ACCESS_TOKEN: ${GOPLUS_ACCESS_TOKEN:-}
      SOLANA_FORENSIC_POLL_SECONDS: ${SOLANA_FORENSIC_POLL_SECONDS:-300}
      SOLANA_ENRICHMENT_SAMPLE_MODULO: ${SOLANA_ENRICHMENT_SAMPLE_MODULO:-50}
      SOLANA_MAX_ENRICHMENTS_PER_CYCLE: ${SOLANA_MAX_ENRICHMENTS_PER_CYCLE:-20}
    restart: unless-stopped

  solana-forward-bootstrap:
    profiles: ["solana"]
    build: .
    command: ["python", "-m", "app.workers.solana_forward_bootstrap"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge
      SIGNER_ENABLED: "false"
      SOLANA_FORWARD_STUDY_EXTERNAL_ID: ${SOLANA_FORWARD_STUDY_EXTERNAL_ID:-solana-pump-baseline-m6g-v1}
      SOLANA_FORWARD_INITIAL_CAPITAL_USD: ${SOLANA_FORWARD_INITIAL_CAPITAL_USD:-1000}
      SOLANA_FORWARD_ENTRY_NOTIONAL_USD: ${SOLANA_FORWARD_ENTRY_NOTIONAL_USD:-25}
      SOLANA_FORWARD_DECISION_DELAY_MINUTES: ${SOLANA_FORWARD_DECISION_DELAY_MINUTES:-5}
      SOLANA_FORWARD_MAX_CANDIDATE_AGE_MINUTES: ${SOLANA_FORWARD_MAX_CANDIDATE_AGE_MINUTES:-30}
      SOLANA_FORWARD_HOLD_MINUTES: ${SOLANA_FORWARD_HOLD_MINUTES:-30}
      SOLANA_FORWARD_MAX_EXIT_DELAY_MINUTES: ${SOLANA_FORWARD_MAX_EXIT_DELAY_MINUTES:-30}
      SOLANA_FORWARD_SHADOW_DELAY_MS: ${SOLANA_FORWARD_SHADOW_DELAY_MS:-1000}
      SOLANA_FORWARD_MAX_QUOTE_PRICE_IMPACT_PCT: ${SOLANA_FORWARD_MAX_QUOTE_PRICE_IMPACT_PCT:-0.05}
      SOLANA_FORWARD_MIN_PREFLIGHT_EXIT_RATIO: ${SOLANA_FORWARD_MIN_PREFLIGHT_EXIT_RATIO:-0.90}
      SOLANA_FORWARD_MAX_OPEN_POSITIONS: ${SOLANA_FORWARD_MAX_OPEN_POSITIONS:-5}
      SOLANA_FORWARD_MAX_ENTRIES_PER_CYCLE: ${SOLANA_FORWARD_MAX_ENTRIES_PER_CYCLE:-3}
      SOLANA_FORWARD_NAV_INTERVAL_SECONDS: ${SOLANA_FORWARD_NAV_INTERVAL_SECONDS:-300}
      EVALUATION_MIN_FORWARD_DAYS: ${EVALUATION_MIN_FORWARD_DAYS:-90}
      EVALUATION_MIN_NAV_OBSERVATIONS: ${EVALUATION_MIN_NAV_OBSERVATIONS:-60}
      EVALUATION_MIN_SHADOW_OBSERVATIONS: ${EVALUATION_MIN_SHADOW_OBSERVATIONS:-30}
      EVALUATION_MIN_TRADES_DEFAULT: ${EVALUATION_MIN_TRADES_DEFAULT:-100}
      EVALUATION_MIN_TRADES_FUNDING: ${EVALUATION_MIN_TRADES_FUNDING:-60}
      EVALUATION_MIN_TRADES_DIRECTIONAL: ${EVALUATION_MIN_TRADES_DIRECTIONAL:-100}
      EVALUATION_MIN_TRADES_MEME: ${EVALUATION_MIN_TRADES_MEME:-300}
      EVALUATION_MIN_FORECASTS_PREDICTION: ${EVALUATION_MIN_FORECASTS_PREDICTION:-50}
      EVALUATION_MAX_DRAWDOWN_PCT: ${EVALUATION_MAX_DRAWDOWN_PCT:-0.15}
      EVALUATION_MIN_PROFIT_FACTOR: ${EVALUATION_MIN_PROFIT_FACTOR:-1.30}
      EVALUATION_MAX_TOP3_PROFIT_CONCENTRATION: ${EVALUATION_MAX_TOP3_PROFIT_CONCENTRATION:-0.50}
      EVALUATION_COST_STRESS_MULTIPLIER: ${EVALUATION_COST_STRESS_MULTIPLIER:-2.0}
      EVALUATION_MIN_SHADOW_FILL_RATIO: ${EVALUATION_MIN_SHADOW_FILL_RATIO:-0.90}
      EVALUATION_MAX_SHADOW_P90_PRICE_DIVERGENCE_BPS: ${EVALUATION_MAX_SHADOW_P90_PRICE_DIVERGENCE_BPS:-50}
      EVALUATION_MAX_PREDICTION_CALIBRATION_ERROR: ${EVALUATION_MAX_PREDICTION_CALIBRATION_ERROR:-0.10}
      EVALUATION_MAX_NAV_GAP_DAYS: ${EVALUATION_MAX_NAV_GAP_DAYS:-3.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  solana-forward-runner:
    profiles: ["solana"]
    build: .
    command: ["python", "-m", "app.workers.solana_forward_runner"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge:${POSTGRES_PASSWORD}@postgres:5432/edge
      REDIS_URL: redis://redis:6379/0
      SIGNER_ENABLED: "false"
      HELIUS_API_KEY: ${HELIUS_API_KEY:?set HELIUS_API_KEY}
      JUPITER_API_KEY: ${JUPITER_API_KEY:?set JUPITER_API_KEY}
      GOPLUS_ACCESS_TOKEN: ${GOPLUS_ACCESS_TOKEN:-}
      SOLANA_FORWARD_STUDY_EXTERNAL_ID: ${SOLANA_FORWARD_STUDY_EXTERNAL_ID:-solana-pump-baseline-m6g-v1}
      SOLANA_FORWARD_POLL_SECONDS: ${SOLANA_FORWARD_POLL_SECONDS:-60}
      SOLANA_FORWARD_HEALTH_MAX_NAV_AGE_SECONDS: ${SOLANA_FORWARD_HEALTH_MAX_NAV_AGE_SECONDS:-900}
      SOLANA_FORWARD_MAX_QUOTE_PRICE_IMPACT_PCT: ${SOLANA_FORWARD_MAX_QUOTE_PRICE_IMPACT_PCT:-0.05}
    depends_on:
      solana-forward-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -m app.solana_forward_ops status --external-id \"$${SOLANA_FORWARD_STUDY_EXTERNAL_ID}\" --require-ready --quiet"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 180s
    restart: unless-stopped
