services:
  control-db-role:
    image: postgres:16-alpine
    profiles: ["controls"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:?set CONTROL_DB_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -h postgres -U edge -d edge -v ON_ERROR_STOP=1 <<'SQL'
        \getenv control_password CONTROL_DB_PASSWORD
        SELECT format('CREATE ROLE edge_control LOGIN PASSWORD %L', :'control_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'edge_control') \gexec
        SELECT format('ALTER ROLE edge_control PASSWORD %L', :'control_password') \gexec
        ALTER ROLE edge_control NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
        ALTER ROLE edge_control SET statement_timeout = '10s';
        ALTER ROLE edge_control SET idle_in_transaction_session_timeout = '10s';
        GRANT CONNECT ON DATABASE edge TO edge_control;
        GRANT USAGE ON SCHEMA public TO edge_control;

        REVOKE ALL ON ALL TABLES IN SCHEMA public FROM edge_control;
        REVOKE ALL ON ALL SEQUENCES IN SCHEMA public FROM edge_control;
        ALTER DEFAULT PRIVILEGES FOR ROLE edge IN SCHEMA public REVOKE ALL ON TABLES FROM edge_control;

        GRANT SELECT ON TABLE
          strategies,
          strategy_versions,
          strategy_evaluation_runs,
          forward_studies,
          forward_nav_observations,
          forward_study_incidents,
          forward_trade_records,
          forward_execution_records,
          hyperliquid_carry_positions,
          hyperliquid_perp_snapshots,
          hyperliquid_funding_snapshots,
          lifecycle_performance_snapshots,
          lifecycle_policy_cycles,
          study_control_settings,
          incident_control_states,
          owner_commands,
          integration_cursors
        TO edge_control;

        GRANT UPDATE (status) ON forward_studies TO edge_control;
        GRANT UPDATE (resolved, resolved_at) ON forward_study_incidents TO edge_control;
        GRANT INSERT, UPDATE ON study_control_settings TO edge_control;
        GRANT INSERT, UPDATE ON incident_control_states TO edge_control;
        GRANT INSERT ON owner_commands TO edge_control;
        GRANT INSERT, UPDATE ON integration_cursors TO edge_control;
        SQL
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: []
    restart: "no"

  owner-control:
    profiles: ["controls"]
    build: .
    command: ["uvicorn", "app.owner_control_server:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge_control:${CONTROL_DB_PASSWORD}@postgres:5432/edge
      SIGNER_ENABLED: "false"
      OWNER_CONTROL_API_TOKEN: ${OWNER_CONTROL_API_TOKEN:?set OWNER_CONTROL_API_TOKEN}
    depends_on:
      control-db-role:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5).read(32)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:8090:8090"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  telegram-controls:
    profiles: ["controls"]
    build: .
    command: ["python", "-m", "app.workers.telegram_controls"]
    environment:
      DATABASE_URL: postgresql+psycopg://edge_control:${CONTROL_DB_PASSWORD}@postgres:5432/edge
      SIGNER_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID}
      TELEGRAM_OWNER_USER_ID: ${TELEGRAM_OWNER_USER_ID:?set TELEGRAM_OWNER_USER_ID}
      TELEGRAM_TIMEOUT_SECONDS: ${TELEGRAM_TIMEOUT_SECONDS:-10}
      TELEGRAM_CONTROL_POLL_TIMEOUT_SECONDS: ${TELEGRAM_CONTROL_POLL_TIMEOUT_SECONDS:-25}
      TELEGRAM_CONTROL_RETRY_SECONDS: ${TELEGRAM_CONTROL_RETRY_SECONDS:-3}
    depends_on:
      control-db-role:
        condition: service_completed_successfully
    ports: []
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
